name: Stream

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webtv-stream
  cancel-in-progress: true

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar sistema
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "INSTALANDO SISTEMA"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            imagemagick \
            curl \
            ca-certificates

      - name: Instalar cloudflared
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "INSTALANDO CLOUDFLARED"
          echo "=========================================="

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      - name: Verificar sistema
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "VERIFICANDO SISTEMA"
          echo "=========================================="

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Chromium:"
          chromium --version

          echo "PulseAudio:"
          pulseaudio --version

          echo "Xvfb:"
          Xvfb -version || true

          echo "Cloudflared:"
          cloudflared --version

          echo "Python:"
          python3 --version

      - name: Preparar ambiente
        shell: bash
        run: |

          set -euxo pipefail

          export DISPLAY=:99

          mkdir -p stream

          rm -f stream/live.m3u8
          rm -f stream/segment_*.ts

      - name: Iniciar transmissão
        shell: bash
        env:
          DISPLAY: ":99"
          PULSE_SINK: "webtv"
          PYTHONUNBUFFERED: "1"
        run: |

          set +e

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 app.py

          CODE=$?

          echo "=========================================="
          echo "WEBTV FINALIZADA"
          echo "Código: $CODE"
          echo "=========================================="

          exit $CODE

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: |
            stream/
            /tmp/*.log

          if-no-files-found: ignore
