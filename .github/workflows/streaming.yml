name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            xvfb \
            chromium \
            python3-pip \
            curl

      - name: Instalar ngrok
        run: |
          curl -sSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo \
            "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update

          sudo apt-get install -y ngrok

          ngrok version

      - name: Instalar Python
        run: |
          python3 -m pip install --upgrade pip --break-system-packages

          pip install \
            playwright \
            --break-system-packages

      - name: Instalar navegador Playwright
        run: |
          playwright install chromium

      - name: Configurar ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "NGROK_AUTHTOKEN não configurado"
            exit 1
          fi

      - name: Verificar código
        run: |
          echo "=== PROCURANDO PYNGROK ==="

          if grep -Rni "pyngrok" app.py; then
            echo "ERRO: pyngrok ainda existe no app.py"
            exit 1
          fi

          if grep -Rni "ngrok.connect" app.py; then
            echo "ERRO: ngrok.connect ainda existe no app.py"
            exit 1
          fi

          echo "OK: app.py não usa pyngrok"

      - name: Iniciar transmissão
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 app.py
