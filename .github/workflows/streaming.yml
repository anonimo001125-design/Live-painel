name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio curl

      - name: Instalar Playwright e Ngrok
        run: |
          pip install playwright pyngrok
          playwright install chromium --with-deps

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          pulseaudio -D --exit-idle-time=-1 --system=false && python app.py
          
