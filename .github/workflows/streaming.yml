name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # BAIXAR REPOSITÓRIO
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ======================================================
      # DEPENDÊNCIAS DO SISTEMA
      # ======================================================

      - name: Instalar dependências
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            curl \
            openssh-client \
            python3 \
            python3-venv


      # ======================================================
      # AMBIENTE PYTHON
      # ======================================================

      - name: Instalar Python
        run: |

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install playwright


      # ======================================================
      # CHROMIUM
      # ======================================================

      - name: Instalar Chromium
        run: |

          . .venv/bin/activate

          playwright install chromium --with-deps


      # ======================================================
      # PREPARAR PASTA
      # ======================================================

      - name: Preparar ambiente
        run: |

          mkdir -p stream

          echo "Ambiente preparado."


      # ======================================================
      # TRANSMISSÃO
      # ======================================================

      - name: Iniciar transmissão
        env:

          # COLOQUE A URL REAL DO SEU PAINEL AQUI
          SITE_URL: "https://SEU-PAINEL-AQUI"

        run: |

          set -o pipefail

          echo ""
          echo "=============================================="
          echo "             INICIANDO WEBTV"
          echo "=============================================="
          echo ""

          . .venv/bin/activate

          python3 app.py


      # ======================================================
      # DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos
        if: always()
        run: |

          echo "=============================================="
          echo "PROCESSOS"
          echo "=============================================="

          ps aux | grep -E \
            "ffmpeg|chromium|Xvfb|pulseaudio|ssh" \
            || true

          echo ""
          echo "=============================================="
          echo "STREAM"
          echo "=============================================="

          ls -lah stream || true

          echo ""
          echo "=============================================="
          echo "PLAYLIST"
          echo "=============================================="

          if [ -f stream/live.m3u8 ]; then
            cat stream/live.m3u8
          else
            echo "live.m3u8 não existe."
          fi
