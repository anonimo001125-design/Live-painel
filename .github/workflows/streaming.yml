name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # BAIXAR CÓDIGO
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ======================================================
      # CORRIGIR DPKG, SE NECESSÁRIO
      # ======================================================

      - name: Corrigir pacotes
        run: |

          sudo dpkg --configure -a || true

          sudo apt-get -f install -y || true


      # ======================================================
      # DEPENDÊNCIAS
      #
      # IMPORTANTE:
      # NÃO INSTALAMOS "chromium".
      # O Chromium será instalado pelo Playwright.
      # ======================================================

      - name: Instalar dependências
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            openssh-client \
            python3-pip \
            python3-venv


      # ======================================================
      # AMBIENTE PYTHON
      # ======================================================

      - name: Criar ambiente Python
        run: |

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          pip install playwright


      # ======================================================
      # CHROMIUM
      # ======================================================

      - name: Instalar Chromium do Playwright
        run: |

          . .venv/bin/activate

          playwright install chromium

          playwright install-deps chromium


      # ======================================================
      # VERIFICAR INSTALAÇÃO
      # ======================================================

      - name: Verificar ambiente
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python3 --version

          echo "=========================================="
          echo "FFMPEG"
          echo "=========================================="

          ffmpeg -version | head -n 3

          echo "=========================================="
          echo "PLAYWRIGHT"
          echo "=========================================="

          . .venv/bin/activate

          playwright --version


      # ======================================================
      # TRANSMISSÃO
      # ======================================================

      - name: Iniciar transmissão

        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          . .venv/bin/activate

          python3 app.py


      # ======================================================
      # SALVAR STREAM / DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
