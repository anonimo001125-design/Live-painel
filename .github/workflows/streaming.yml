name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # CÓDIGO
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: Instalar dependências
        timeout-minutes: 10
        run: |

          echo "========================================"
          echo "INSTALANDO DEPENDÊNCIAS"
          echo "========================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            openssh-client \
            python3-pip \
            python3-venv

          echo "========================================"
          echo "DEPENDÊNCIAS INSTALADAS"
          echo "========================================"


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Preparar Python
        run: |

          echo "========================================"
          echo "PREPARANDO PYTHON"
          echo "========================================"

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          pip install --no-cache-dir playwright

          echo "Python pronto."

          python --version

          playwright --version


      # ======================================================
      # CHROMIUM
      # ======================================================

      - name: Instalar Chromium
        timeout-minutes: 10
        run: |

          echo "========================================"
          echo "INSTALANDO CHROMIUM"
          echo "========================================"

          . .venv/bin/activate

          playwright install chromium

          echo "Chromium instalado."

          playwright --version


      # ======================================================
      # VERIFICAÇÃO
      # ======================================================

      - name: Verificar ambiente
        run: |

          echo "========================================"
          echo "VERIFICAÇÃO"
          echo "========================================"

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 3

          echo ""
          echo "Xvfb:"
          which Xvfb

          echo ""
          echo "PulseAudio:"
          which pulseaudio

          echo ""
          echo "xdotool:"
          which xdotool

          echo ""
          echo "SSH:"
          which ssh

          echo ""
          echo "Playwright:"

          . .venv/bin/activate

          playwright --version

          echo ""
          echo "========================================"
          echo "AMBIENTE OK"
          echo "========================================"


      # ======================================================
      # STREAM
      # ======================================================

      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          echo "========================================"
          echo "INICIANDO TRANSMISSÃO"
          echo "========================================"

          . .venv/bin/activate

          python3 -u app.py


      # ======================================================
      # DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: stream-debug

          path: stream/

          if-no-files-found: ignore
