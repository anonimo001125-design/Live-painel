name: WebTV Streaming

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            pulseaudio \
            ffmpeg \
            chromium-browser \
            xdotool \
            imagemagick \
            curl \
            openssh-client

      - name: Instalar cloudflared
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Verificar arquivos
        run: |
          echo "Arquivos do projeto:"
          ls -la

          echo
          echo "Verificando app.py..."

          test -f app.py

          echo "app.py encontrado."

      - name: Iniciar transmissão
        env:
          WORKER_UPDATE_URL: ${{ secrets.WORKER_UPDATE_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          python3 app.py

      - name: Finalização
        if: always()
        run: |
          echo "Execução da WebTV finalizada."
