name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            xvfb \
            openssh-client \
            python3 \
            python3-pip

      - name: Instalar Python
        run: |
          python3 -m pip install --user --break-system-packages playwright

      - name: Instalar Chromium
        run: |
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium

      - name: Preparar ambiente
        run: |
          mkdir -p stream

          echo "Ambiente preparado."

          echo "Verificando FFmpeg..."
          ffmpeg -version | head -n 1

          echo "Verificando Chromium..."
          chromium --version || true

      - name: Iniciar transmissão
        run: |
          set -o pipefail

          echo "=========================================="
          echo "           INICIANDO WEBTV"
          echo "=========================================="

          python3 app.py

      - name: Salvar diagnósticos
        if: always()
        run: |
          echo "=========================================="
          echo "             PROCESSOS"
          echo "=========================================="

          ps aux | grep -E "ffmpeg|chrom|Xvfb|pulse|ssh" || true

          echo ""
          echo "=========================================="
          echo "              STREAM"
          echo "=========================================="

          ls -lah stream || true

          echo ""
          echo "=========================================="
          echo "           PLAYLIST HLS"
          echo "=========================================="

          cat stream/live.m3u8 2>/dev/null || true
