name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio curl

      - name: Instalar Playwright e Ngrok
        run: |
          pip install playwright pyngrok
          playwright install chromium --with-deps

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          pulseaudio -D --exit-idle-time=-1 --system=false && python app.py


      # ======================================================
      # INICIAR TRANSMISSÃO
      # ======================================================

      - name: Iniciar transmissão

        env:

          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

        run: |

          python3 app.py


      # ======================================================
      # SALVAR DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
