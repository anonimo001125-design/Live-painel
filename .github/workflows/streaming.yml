name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            chromium \
            openssh-client


      - name: Instalar Python e Playwright
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install \
            playwright

          python3 -m playwright install chromium


      - name: Verificar sistema
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python3 --version

          echo "======================================"
          echo "FFMPEG"
          echo "======================================"

          ffmpeg -version | head -n 3

          echo "======================================"
          echo "CHROMIUM"
          echo "======================================"

          chromium --version

          echo "======================================"
          echo "PLAYWRIGHT"
          echo "======================================"

          python3 -c "import playwright; print('Playwright OK')"


      - name: Preparar ambiente
        run: |
          mkdir -p stream

          echo "Ambiente preparado."


      - name: Iniciar transmissão
        env:
          DISPLAY: ":99"
          PULSE_SINK: "webtv"
          PYTHONUNBUFFERED: "1"

        run: |
          echo "======================================"
          echo "INICIANDO WEBTV"
          echo "======================================"

          python3 app.py


      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtv-debug
          path: stream/
          if-no-files-found: ignore
