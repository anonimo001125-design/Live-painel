name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # CÓDIGO
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ======================================================
      # SISTEMA
      # ======================================================

      - name: Instalar sistema
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "ATUALIZANDO SISTEMA"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            curl \
            ca-certificates


      # ======================================================
      # CLOUDFLARED
      # ======================================================

      - name: Instalar Cloudflare Tunnel
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALANDO CLOUDFLARED"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Verificar Python
        shell: bash
        run: |

          set -e

          python3 --version
          pip3 --version || true


      # ======================================================
      # VERIFICAÇÃO
      # ======================================================

      - name: Verificar sistema
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFICAÇÃO"
          echo "=========================================="

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Chromium:"
          chromium --version

          echo "PulseAudio:"
          pulseaudio --version

          echo "Xvfb:"
          Xvfb -version 2>&1 | head -n 1 || true

          echo "Cloudflared:"
          cloudflared --version

          echo "Python:"
          python3 --version


      # ======================================================
      # TRANSMISSÃO
      # ======================================================

      - name: Iniciar transmissão
        shell: bash
        env:

          DISPLAY: ":99"

          PYTHONUNBUFFERED: "1"

          PULSE_SINK: "webtv"

        run: |

          set +e

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 -u app.py

          CODE=$?

          echo ""
          echo "=========================================="
          echo "WEBTV FINALIZADA"
          echo "Código: $CODE"
          echo "=========================================="

          exit $CODE


      # ======================================================
      # DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: |
            stream/
            /tmp/webtv*.log

          if-no-files-found: ignore
