name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # BAIXAR CÓDIGO
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ======================================================
      # INSTALAR SISTEMA
      # ======================================================

      - name: Instalar dependências
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            openssh-client \
            python3-venv


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Instalar Python
        run: |

          python3 -m venv .venv

          .venv/bin/python -m pip install --upgrade pip

          .venv/bin/python -m pip install pyppeteer==2.0.0


      # ======================================================
      # VERIFICAR SISTEMA
      # ======================================================

      - name: Verificar instalações
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          .venv/bin/python --version


          echo "=========================================="
          echo "CHROMIUM"
          echo "=========================================="

          chromium --version


          echo "=========================================="
          echo "FFMPEG"
          echo "=========================================="

          ffmpeg -version | head -n 2


          echo "=========================================="
          echo "PULSEAUDIO"
          echo "=========================================="

          pulseaudio --version


          echo "=========================================="
          echo "XDOTOOL"
          echo "=========================================="

          xdotool --version


      # ======================================================
      # PREPARAR STREAM
      # ======================================================

      - name: Preparar ambiente
        run: |

          mkdir -p stream

          echo "Ambiente preparado."


      # ======================================================
      # INICIAR TRANSMISSÃO
      # ======================================================

      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"

        run: |

          set -o pipefail

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          .venv/bin/python app.py


      # ======================================================
      # SALVAR DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
