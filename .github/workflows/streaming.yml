name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Ferramentas de Video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          # Instala o extrator inteligente de video oficial
          sudo curl -L https://github.com -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          python app.py
          
