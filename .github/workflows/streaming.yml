name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Instalar Extratores via Python
        run: |
          # Instala o yt-dlp de forma direta e segura no ambiente do Python
          pip install yt-dlp

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          python app.py
