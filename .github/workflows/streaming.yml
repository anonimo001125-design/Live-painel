name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Sistema de Som, Video e Navegador Oficial
        run: |
          sudo apt-get update
          # Instala o navegador Chromium direto no Linux de forma estavel
          sudo apt-get install -y ffmpeg pulseaudio xvfb xdotool chromium-browser

      - name: Instalar Conectores do Python
        run: |
          pip install pyppeteer

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          python app.py
