name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # BAIXAR PROJETO
      # ======================================================

      - name: Baixar codigo
        uses: actions/checkout@v4


      # ======================================================
      # INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            python3-pip \
            openssh-client \
            wget \
            ca-certificates


      # ======================================================
      # CLOUDFLARED
      # ======================================================

      - name: Instalar Cloudflare Tunnel
        run: |

          sudo wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version


      # ======================================================
      # PYPPETEER
      # ======================================================

      - name: Instalar Pyppeteer
        run: |

          python3 -m pip install --upgrade pip

          pip install pyppeteer


      # ======================================================
      # NÃO BAIXAR OUTRO CHROMIUM
      #
      # O app.py usa:
      # /usr/bin/chromium
      #
      # Portanto usamos o Chromium instalado pelo Ubuntu.
      # ======================================================

      - name: Verificar Chromium
        run: |

          which chromium

          chromium --version


      # ======================================================
      # VERIFICAR FFMPEG
      # ======================================================

      - name: Verificar FFmpeg
        run: |

          ffmpeg -version


      # ======================================================
      # VERIFICAR PYTHON
      # ======================================================

      - name: Verificar Python
        run: |

          python3 --version


      # ======================================================
      # VERIFICAR SINTAXE
      # ======================================================

      - name: Verificar app.py
        run: |

          python3 -m py_compile app.py

          echo "app.py OK"


      # ======================================================
      # INICIAR TRANSMISSAO
      # ======================================================

      - name: Iniciar transmissao

        env:

          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"

          DISPLAY: ":99"

          PYTHONUNBUFFERED: "1"

        run: |

          python3 app.py


      # ======================================================
      # SALVAR DEBUG
      # ======================================================

      - name: Salvar arquivos de debug

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
