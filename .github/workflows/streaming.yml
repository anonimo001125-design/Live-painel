name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            openssh-client


      - name: Instalar Pyppeteer
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install pyppeteer


      - name: Verificar sistema
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python3 --version

          echo "=========================================="
          echo "FFMPEG"
          echo "=========================================="

          ffmpeg -version | head -n 3

          echo "=========================================="
          echo "CHROMIUM"
          echo "=========================================="

          chromium --version

          echo "=========================================="
          echo "PULSEAUDIO"
          echo "=========================================="

          pulseaudio --version


      - name: Preparar ambiente
        run: |

          mkdir -p stream

          echo "Ambiente preparado."


      - name: Iniciar transmissão
        env:

          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

        run: |

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 -u app.py


      - name: Salvar diagnósticos
        if: always()
        run: |

          echo "=========================================="
          echo "PROCESSOS"
          echo "=========================================="

          ps aux | grep -E \
            "ffmpeg|chromium|Xvfb|pulseaudio|http.server|ssh" \
            || true

          echo "=========================================="
          echo "STREAM"
          echo "=========================================="

          ls -lah stream/ || true

          echo "=========================================="
          echo "PLAYLIST"
          echo "=========================================="

          cat stream/live.m3u8 2>/dev/null || true

          echo "=========================================="
          echo "LINK"
          echo "=========================================="

          cat stream/LINK_DA_TRANSMISSAO.txt 2>/dev/null || true


      - name: Salvar arquivos da transmissão
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: webtv-stream

          path: stream/

          if-no-files-found: ignore
