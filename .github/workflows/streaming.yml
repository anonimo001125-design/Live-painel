name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar dependências
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            openssh-client \
            python3-pip \
            python3-venv


      - name: Preparar Python
        run: |

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          pip install playwright


      - name: Instalar Chromium
        run: |

          . .venv/bin/activate

          playwright install chromium

          playwright install-deps chromium


      - name: Verificar ambiente
        run: |

          echo "=============================="
          echo "PYTHON"
          echo "=============================="

          python3 --version

          echo "=============================="
          echo "FFMPEG"
          echo "=============================="

          ffmpeg -version | head -n 3

          echo "=============================="
          echo "PLAYWRIGHT"
          echo "=============================="

          . .venv/bin/activate

          playwright --version


      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          . .venv/bin/activate

          python3 app.py


      - name: Salvar diagnósticos
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: stream-debug

          path: stream/

          if-no-files-found: ignore
