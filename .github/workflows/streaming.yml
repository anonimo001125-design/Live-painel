name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALANDO SISTEMA"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            curl \
            wget \
            ca-certificates

          echo "=========================================="
          echo "SISTEMA INSTALADO"
          echo "=========================================="


      - name: Instalar Cloudflare Tunnel
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALANDO CLOUDFLARED"
          echo "=========================================="

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in

            amd64)
              CLOUDFLARED_ARCH="amd64"
              ;;

            arm64)
              CLOUDFLARED_ARCH="arm64"
              ;;

            *)
              echo "Arquitetura não suportada: $ARCH"
              exit 1
              ;;

          esac

          wget -q \
            -O /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CLOUDFLARED_ARCH}.deb"

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

          echo "=========================================="
          echo "CLOUDFLARED INSTALADO"
          echo "=========================================="


      - name: Verificar sistema
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFICANDO SISTEMA"
          echo "=========================================="

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Chromium:"
          chromium --version

          echo "PulseAudio:"
          pulseaudio --version

          echo "Xvfb:"
          Xvfb -version 2>&1 | head -n 1 || true

          echo "Cloudflared:"
          cloudflared --version

          echo "Python:"
          python3 --version

          echo "=========================================="
          echo "SISTEMA OK"
          echo "=========================================="


      - name: Iniciar transmissão
        shell: bash
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          set -e

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 -u app.py


      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
