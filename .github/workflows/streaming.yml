name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            xvfb \
            xdotool \
            chromium \
            openssh-client

      - name: Instalar Pyppeteer
        run: |
          python3 -m pip install --upgrade pip
          pip install pyppeteer

      - name: Iniciar transmissão
        env:
          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"
        run: |
          python3 app.py
