name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Som e Video do Sistema
        run: |
          sudo apt-get update
          # xdotool adicionado para emular cliques de hardware reais
          sudo apt-get install -y ffmpeg pulseaudio xvfb xdotool

      - name: Instalar Gravador Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          pulseaudio -D --exit-idle-time=-1 --system=false && python app.py
          
