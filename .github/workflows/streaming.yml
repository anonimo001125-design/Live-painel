name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-22.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            xvfb \
            xdotool \
            openssh-client \
            python3-pip \
            python3-dev

      - name: Instalar Python
        run: |

          python3 -m pip install \
            --upgrade \
            pip \
            --break-system-packages

          pip install \
            playwright \
            --break-system-packages

      - name: Instalar Chromium
        run: |

          playwright install chromium --with-deps

      - name: Iniciar transmissão
        run: |

          mkdir -p stream

          pulseaudio \
            -D \
            --exit-idle-time=-1 \
            --system=false

          sleep 3

          python3 app.py
