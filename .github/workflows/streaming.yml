name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar Transmissao Unificada
        run: |
          mkdir -p $(pwd)/stream
          docker build -t app .
          docker run --name live -v $(pwd)/stream:/app/stream -p 8080:8080 app
          
