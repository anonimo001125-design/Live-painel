name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio xvfb xdotool

      - name: Instalar Navegador Pyppeteer
        run: |
          # Instala o motor leve do navegador direto no sistema do GitHub
          pip install pyppeteer

      - name: Iniciar Transmissao e Servidor
        run: |
          mkdir -p stream
          python app.py
