name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-22.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar dependências
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            x11-utils \
            xdotool \
            openssh-client \
            python3 \
            python3-pip \
            python3-venv


      - name: Criar ambiente Python
        run: |

          python3 -m venv venv

          ./venv/bin/python -m pip install --upgrade pip


      - name: Instalar Python
        run: |

          ./venv/bin/pip install \
            playwright \
            pyngrok


      - name: Instalar Chromium
        run: |

          ./venv/bin/playwright install chromium

          ./venv/bin/playwright install-deps chromium


      - name: Preparar transmissão
        run: |

          mkdir -p stream

          echo "=========================================="
          echo "AMBIENTE PREPARADO"
          echo "=========================================="

          ./venv/bin/python --version

          ffmpeg -version | head -n 1


      - name: Iniciar transmissão
        env:

          # ==================================================
          # COLOQUE AQUI A URL DO SEU PAINEL
          # ==================================================

          URL_ALVO: "https://ais-pre-czbrtxxjttcqeqhdn3kw3n-102718744012.us-east5.run.app/watch"

        run: |

          echo "=========================================="
          echo "INICIANDO WEB TV"
          echo "=========================================="

          ./venv/bin/python app.py
