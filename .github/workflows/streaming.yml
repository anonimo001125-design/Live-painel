name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            chromium \
            curl

          echo "Chromium:"
          chromium --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1


      - name: Instalar Cloudflare Tunnel
        run: |

          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared

          sudo install -m 0755 \
            /tmp/cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version


      - name: Instalar Playwright
        run: |

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install playwright


      - name: Preparar ambiente
        run: |

          mkdir -p stream

          echo "Ambiente preparado."


      - name: Verificar sintaxe
        run: |

          . .venv/bin/activate

          python -m py_compile app.py

          echo "Sintaxe OK."


      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

        run: |

          . .venv/bin/activate

          python app.py


      - name: Salvar transmissão
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-stream-debug

          path: stream/

          if-no-files-found: ignore
