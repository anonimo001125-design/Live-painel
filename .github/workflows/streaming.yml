name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            chromium \
            openssh-client


      - name: Instalar Python
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install pyppeteer


      - name: Verificar sistema
        run: |

          echo "========================================"
          echo "PYTHON"
          python3 --version

          echo "========================================"
          echo "CHROMIUM"
          chromium --version

          echo "========================================"
          echo "FFMPEG"
          ffmpeg -version | head -n 1

          echo "========================================"
          echo "SSH"
          ssh -V


      - name: Preparar ambiente
        run: |

          rm -rf stream

          mkdir -p stream

          echo "Ambiente preparado."


      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"

        run: |

          echo "========================================"
          echo "INICIANDO WEBTV"
          echo "========================================"

          python3 app.py


      - name: Salvar diagnósticos
        if: always()
        run: |

          echo "===== PROCESSOS ====="

          ps aux | grep -E \
            'ffmpeg|chromium|Xvfb|pulseaudio|ssh' \
            | grep -v grep \
            || true

          echo "===== STREAM ====="

          ls -lah stream/ \
            || true


      - name: Salvar arquivos da transmissão
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: webtv-stream

          path: stream/

          if-no-files-found: ignore
