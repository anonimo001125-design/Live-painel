name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar sistema
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            openssh-client \
            curl \
            imagemagick

      - name: Verificar sistema
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICANDO SISTEMA"
          echo "=========================================="

          ffmpeg -version | head -n 1
          chromium --version
          pulseaudio --version
          pactl --version
          Xvfb -version 2>&1 | head -n 1
          ssh -V 2>&1 | head -n 1
          curl --version | head -n 1
          xdotool --version

          echo "=========================================="
          echo "SISTEMA OK"
          echo "=========================================="

      - name: Iniciar transmissão
        env:
          DISPLAY: ":99"
          PULSE_SINK: "webtv"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 app.py

          STATUS=$?

          echo "=========================================="
          echo "WEBTV FINALIZADA"
          echo "Código: $STATUS"
          echo "=========================================="

          exit $STATUS

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtv-debug
          path: stream/
          if-no-files-found: ignore
