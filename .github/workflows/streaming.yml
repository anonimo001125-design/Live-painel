name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar Transmissao Unificada
        run: |
          mkdir -p $(pwd)/stream
          docker build -t app .
          
          echo "=========================================================="
          echo " INICIANDO SERVIDOR E CAPTURA DE TELA... "
          echo "=========================================================="
          
          # Executa o container mostrando todos os logs direto na sua tela
          docker run --name live -v $(pwd)/stream:/app/stream -p 8080:8080 app
          
