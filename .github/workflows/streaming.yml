name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4


      - name: Instalar dependencias
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            python3-pip \
            wget \
            ca-certificates


      - name: Instalar Cloudflared
        run: |

          sudo wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version


      - name: Instalar Playwright
        run: |

          python3 -m pip install --upgrade pip

          pip install playwright


      - name: Verificar sistema
        run: |

          echo "========== PYTHON =========="
          python3 --version

          echo "========== CHROMIUM =========="
          chromium --version

          echo "========== FFMPEG =========="
          ffmpeg -version

          echo "========== CLOUDFLARED =========="
          cloudflared --version


      - name: Verificar codigo
        run: |

          python3 -m py_compile app.py

          echo "Codigo OK"


      - name: Iniciar transmissao
        env:

          DISPLAY: ":99"

          PYTHONUNBUFFERED: "1"

        run: |

          python3 app.py


      - name: Salvar debug
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
