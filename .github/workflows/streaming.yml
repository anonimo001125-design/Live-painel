name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      # ======================================================
      # BAIXAR CÓDIGO
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ======================================================
      # INSTALAR SISTEMA
      # ======================================================

      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            openssh-client


      # ======================================================
      # PYPPETEER
      # ======================================================

      - name: Instalar Pyppeteer
        run: |

          python3 -m pip install --upgrade pip

          pip install pyppeteer


      # ======================================================
      # VERIFICAR
      # ======================================================

      - name: Verificar sistema
        run: |

          echo "=========================================="
          echo "FFMPEG"
          echo "=========================================="

          ffmpeg -version | head -n 3

          echo "=========================================="
          echo "CHROMIUM"
          echo "=========================================="

          chromium --version

          echo "=========================================="
          echo "PULSEAUDIO"
          echo "=========================================="

          pulseaudio --version

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python3 --version


      # ======================================================
      # TRANSMISSÃO
      # ======================================================

      - name: Iniciar transmissão

        env:

          PYPPETEER_NO_CHROMIUM_DOWNLOAD: "1"

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          python3 app.py


      # ======================================================
      # DIAGNÓSTICOS
      # ======================================================

      - name: Salvar diagnósticos

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
