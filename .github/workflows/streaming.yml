streaming.yml

name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALANDO DEPENDÊNCIAS"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            curl \
            ca-certificates \
            gnupg

          echo "=========================================="
          echo "INSTALANDO CLOUDFLARED"
          echo "=========================================="

          sudo mkdir -p \
            --mode=0755 \
            /usr/share/keyrings

          curl -fsSL \
            https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee \
            /usr/share/keyrings/cloudflare-main.gpg \
            > /dev/null

          echo \
            "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee \
            /etc/apt/sources.list.d/cloudflared.list \
            > /dev/null

          sudo apt-get update

          sudo apt-get install -y cloudflared

          echo "=========================================="
          echo "INSTALAÇÃO CONCLUÍDA"
          echo "=========================================="

          ffmpeg -version | head -n 1

          chromium --version

          pulseaudio --version

          cloudflared --version

          python3 --version


      - name: Verificar arquivos
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFICANDO ARQUIVOS"
          echo "=========================================="

          test -f app.py

          echo "app.py encontrado."

          echo "Arquivos do projeto:"

          ls -la


      - name: Iniciar transmissão
        shell: bash
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          set +e

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 -u app.py

          CODE=$?

          echo "=========================================="
          echo "WEBTV FINALIZADA"
          echo "Código: $CODE"
          echo "=========================================="

          exit $CODE


      - name: Salvar diagnósticos
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
