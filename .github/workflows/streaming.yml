name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            openssh-client \
            python3-pip


      - name: Instalar Playwright
        run: |

          python3 -m pip install --upgrade pip

          pip install playwright


      - name: Instalar dependencias do Chromium
        run: |

          playwright install-deps chromium


      - name: Verificar sistema
        run: |

          echo "=========================================="
          echo "PYTHON"
          python3 --version

          echo "=========================================="
          echo "CHROMIUM"
          chromium --version

          echo "=========================================="
          echo "FFMPEG"
          ffmpeg -version | head -n 1

          echo "=========================================="
          echo "PULSEAUDIO"
          pulseaudio --version

          echo "=========================================="
          echo "PLAYWRIGHT"
          python3 -c "import playwright; print('Playwright OK')"


      - name: Verificar codigo
        run: |

          python3 -m py_compile app.py

          echo "Codigo Python OK"


      - name: Iniciar transmissao
        env:

          DISPLAY: ":99"

          PYTHONUNBUFFERED: "1"

        run: |

          python3 app.py


      - name: Guardar diagnosticos
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
