name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    env:
      PYTHONUNBUFFERED: "1"
      URL_ALVO: "https://ais-pre-czbrtxxjttcqeqhdn3kw3n-102718744012.us-east5.run.app/watch"

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            openssh-client \
            python3 \
            python3-pip

      - name: Instalar Python
        shell: bash
        run: |
          python3 -m pip install \
            --user \
            --upgrade \
            playwright

      - name: Instalar Chromium
        shell: bash
        run: |
          python3 -m playwright install chromium

      - name: Preparar ambiente
        shell: bash
        run: |
          mkdir -p stream

          echo "======================================"
          echo "AMBIENTE PREPARADO"
          echo "======================================"

          python3 --version
          ffmpeg -version | head -n 1
          Xvfb -version || true

      - name: Iniciar transmissão
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "INICIANDO WEBTV"
          echo "======================================"

          python3 app.py

      - name: Salvar diagnósticos
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "PROCESSOS"
          echo "======================================"

          ps aux | grep -E \
            'ffmpeg|chrom|Xvfb|pulse|http.server|ssh' \
            | grep -v grep || true

          echo ""
          echo "======================================"
          echo "STREAM"
          echo "======================================"

          ls -lah stream || true

          echo ""
          echo "======================================"
          echo "LIVE.M3U8"
          echo "======================================"

          if [ -f stream/live.m3u8 ]; then
            cat stream/live.m3u8
          else
            echo "live.m3u8 não foi criado."
          fi
