name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALANDO SISTEMA"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            curl \
            ca-certificates


      - name: Instalar Cloudflare Tunnel
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALANDO CLOUDFLARED"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          sudo install \
            -m 0755 \
            /tmp/cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version


      - name: Verificar sistema
        shell: bash
        run: |

          echo "=========================================="
          echo "VERIFICAÇÃO"
          echo "=========================================="

          ffmpeg -version | head -n 1

          chromium --version

          pulseaudio --version

          cloudflared --version

          python3 --version

          echo "=========================================="
          echo "SISTEMA OK"
          echo "=========================================="


      - name: Iniciar transmissão
        shell: bash
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

          PYTHONUNBUFFERED: "1"

        run: |

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 -u app.py


      - name: Salvar diagnósticos
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
