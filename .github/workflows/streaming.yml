name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            chromium \
            python3-pip \
            wget \
            ca-certificates


      - name: Instalar Cloudflare Tunnel
        run: |

          sudo wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version


      - name: Instalar Playwright
        run: |

          python3 -m pip install --upgrade pip

          pip install playwright


      - name: Verificar sistema
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python3 --version

          echo "=========================================="
          echo "FFMPEG"
          echo "=========================================="

          ffmpeg -version

          echo "=========================================="
          echo "CHROMIUM"
          echo "=========================================="

          chromium --version

          echo "=========================================="
          echo "PLAYWRIGHT"
          echo "=========================================="

          python3 -c "import playwright; print('Playwright OK')"

          echo "=========================================="
          echo "CLOUDFLARE"
          echo "=========================================="

          cloudflared --version


      - name: Preparar ambiente
        run: |

          mkdir -p stream

          echo "Ambiente preparado."


      - name: Verificar sintaxe
        run: |

          python3 -m py_compile app.py

          echo "Sintaxe Python OK."


      - name: Iniciar transmissao
        env:

          DISPLAY: ":99"

          PYTHONUNBUFFERED: "1"

        run: |

          python3 app.py


      - name: Salvar transmissao
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-stream

          path: stream/

          if-no-files-found: ignore

      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

        run: |

          . .venv/bin/activate

          python app.py


      - name: Salvar transmissão
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: webtv-stream

          path: stream/

          if-no-files-found: ignore
