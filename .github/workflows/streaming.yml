name: Stream

on:
  workflow_dispatch:

jobs:
  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            chromium \
            curl


      - name: Instalar Cloudflare Tunnel
        run: |

          curl -L \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version


      - name: Instalar Python
        run: |

          python3 -m pip install --upgrade pip

          pip install playwright


      - name: Instalar navegador Playwright
        run: |

          python3 -m playwright install chromium


      - name: Verificar sistema
        run: |

          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python3 --version

          echo "======================================"
          echo "FFMPEG"
          echo "======================================"

          ffmpeg -version | head -n 2

          echo "======================================"
          echo "CHROMIUM"
          echo "======================================"

          chromium --version

          echo "======================================"
          echo "CLOUDFLARED"
          echo "======================================"

          cloudflared --version

          echo "======================================"
          echo "PLAYWRIGHT"
          echo "======================================"

          python3 -c "from playwright.sync_api import sync_playwright; print('Playwright OK')"


      - name: Preparar ambiente
        run: |

          mkdir -p stream

          echo "Ambiente preparado."


      - name: Verificar sintaxe
        run: |

          python3 -m py_compile app.py

          echo "Sintaxe do app.py OK."


      - name: Iniciar transmissão
        env:

          DISPLAY: ":99"

          PULSE_SINK: "webtv"

        run: |

          echo "======================================"
          echo "INICIANDO WEBTV"
          echo "======================================"

          python3 app.py


      - name: Salvar transmissão
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: webtv-stream

          path: stream/

          if-no-files-found: ignore


      - name: Salvar diagnósticos
        if: always()
        run: |

          echo "===== PROCESSOS ====="

          ps aux | grep -E \
            "ffmpeg|chromium|Xvfb|pulseaudio|cloudflared" \
            || true

          echo "===== STREAM ====="

          ls -lah stream/ || true

          echo "===== HLS ====="

          cat stream/live.m3u8 2>/dev/null || true
