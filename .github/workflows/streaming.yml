name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar sistema
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALANDO SISTEMA"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            xdotool \
            chromium \
            curl \
            ca-certificates

          echo "=========================================="
          echo "INSTALANDO CLOUDFLARED"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i /tmp/cloudflared.deb

          echo "=========================================="
          echo "VERIFICANDO INSTALAÇÃO"
          echo "=========================================="

          ffmpeg -version | head -n 1
          chromium --version
          pulseaudio --version
          Xvfb -version 2>&1 | head -n 1 || true
          cloudflared --version

          echo "=========================================="
          echo "SISTEMA PRONTO"
          echo "=========================================="

      - name: Verificar arquivos
        shell: bash
        run: |
          set -e

          echo "Diretório atual:"
          pwd

          echo ""
          echo "Arquivos:"
          ls -la

          echo ""
          echo "Verificando app.py:"

          test -f app.py

          head -n 10 app.py

          echo ""
          echo "app.py encontrado."

      - name: Iniciar transmissão
        shell: bash
        env:
          DISPLAY: ":99"
          PULSE_SINK: "webtv"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e

          echo "=========================================="
          echo "INICIANDO WEBTV"
          echo "=========================================="

          python3 -u app.py

          CODE=$?

          echo "=========================================="
          echo "WEBTV FINALIZADA"
          echo "Código: $CODE"
          echo "=========================================="

          exit $CODE

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtv-debug
          path: stream/
          if-no-files-found: ignore
