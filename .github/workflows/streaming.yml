name: Stream

on:
  workflow_dispatch:

jobs:

  run-stream:

    runs-on: ubuntu-24.04

    timeout-minutes: 350

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar sistema
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils \
            xvfb \
            chromium \
            python3-pip \
            wget \
            ca-certificates

      - name: Instalar Cloudflare
        run: |

          sudo wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version

      - name: Instalar Playwright
        run: |

          python3 -m pip install --upgrade pip

          pip install playwright

      - name: Instalar navegador do Playwright
        run: |

          playwright install chromium

      - name: Verificar sistema
        run: |

          python3 --version

          ffmpeg -version

          chromium --version

          cloudflared --version

      - name: Verificar sintaxe
        run: |

          python3 -m py_compile app.py

          echo "Sintaxe OK"

      - name: Iniciar transmissao
        env:

          DISPLAY: ":99"

          PYTHONUNBUFFERED: "1"

        run: |

          python3 app.py

      - name: Salvar diagnosticos
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: webtv-debug

          path: stream/

          if-no-files-found: ignore
